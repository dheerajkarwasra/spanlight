[project]
name = "spanlight"
version = "0.2.1"
description = "Python SDK for Spanlight, open-source observability for LLM applications."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Dheeraj" }]
keywords = ["llm", "observability", "tracing", "openai", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
openai = ["openai>=1.66"]
anthropic = ["anthropic>=0.40"]

[dependency-groups]
dev = [
    "anthropic>=0.40",
    "mypy>=1.13",
    "openai>=1.66",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spanlight"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "ANN", # annotations
    "D",   # pydocstyle
]
ignore = [
    "D105", # magic methods are self-explanatory
    "D107", # __init__ documented on the class
    "ANN401", # Any is deliberate where we accept arbitrary user values
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
"examples/**" = ["D"]
# Endpoint/accumulator overrides are documented on their abstract base class.
"src/spanlight/integrations/*.py" = ["D102"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
