# Runs two api replicas behind the web proxy, to check that they share their rate limits.
#   docker compose -f deploy/compose.yaml -f deploy/compose.replicas.yaml --env-file deploy/.env up -d --build
# Both replicas draw from the same Postgres-backed token buckets, so a client that sends one
# burst through the proxy is limited once, however its requests are spread between them.
#
# Replicas are the scale-out unit: one uvicorn process per container. For N replicas, pass
# `--scale api=N` (it wins over `replicas:` below) and list all N container names in both
# upstreams, for example three:
#   docker compose -f deploy/compose.yaml -f deploy/compose.replicas.yaml --env-file deploy/.env up -d --build --scale api=3
#   API_UPSTREAM: spanlight-api-1:8000 spanlight-api-2:8000 spanlight-api-3:8000
#   GATEWAY_UPSTREAM: ${GATEWAY_UPSTREAM:-spanlight-api-1:8000 spanlight-api-2:8000 spanlight-api-3:8000}
# A replica missing from the list gets no traffic. Each replica opens up to 30 database
# connections: check the budget in docs/runbooks/scale.md before adding one.

services:
  api:
    deploy:
      replicas: 2

  # Caddy resolves a single hostname once per connection and would keep sending a client's
  # requests to the same replica. Naming both containers makes it balance between them.
  # Container names are <project>-<service>-<index>; the project is "spanlight" (compose.yaml).
  web:
    environment:
      API_UPSTREAM: spanlight-api-1:8000 spanlight-api-2:8000
      # The gateway is embedded in the api, so /gw/* is balanced the same way. With a standalone
      # gateway, set GATEWAY_UPSTREAM in deploy/.env and it wins.
      GATEWAY_UPSTREAM: ${GATEWAY_UPSTREAM:-spanlight-api-1:8000 spanlight-api-2:8000}
