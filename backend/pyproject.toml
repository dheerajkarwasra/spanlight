[project]
name = "spanlight-backend"
version = "0.1.0"
description = "Spanlight backend: LLM observability API, ingestion and worker."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.110",
    "cryptography>=50.0.2",
    "defusedxml>=0.7.1",
    "email-validator>=2.3.0",
    "fastapi>=0.142.3",
    "httpcore>=1.0.9,<2",
    "httpx>=0.28.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-proto>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyotp>=2.10.0",
    "python-multipart>=0.0.20",
    "regex>=2026.9.29",
    "sentry-sdk>=2.71.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=26.1.0",
    "typer>=0.27.3",
    "uuid6>=2025.0.1 ; python_full_version < '3.14'",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
spanlight = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "anthropic>=1.12.0",
    "boto3-stubs[s3]>=1.43.110",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "types-defusedxml>=0.7.0.20260504",
    "types-regex>=2026.9.29.20261005",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
# SQLAlchemy's async engine runs ORM code inside greenlets; without greenlet
# tracing, lines executed there are reported as missed.
concurrency = ["greenlet", "thread"]
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# `load` holds the load-test scripts, which import their sibling modules (seed_data) by name.
src = [".", "load"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "SIM", "RUF", "PL", "PT", "BLE", "TID251"]
ignore = [
    "PLR0913",  # FastAPI handlers legitimately take many injected parameters
    "PLR2004",  # magic values are fine in comparisons against HTTP codes
    "S608",     # SQL is built from constants only, never user input
    "PLR0917",  # FastAPI handlers declare their injected dependencies positionally
    "PLR0911",  # value-dispatch functions read best as one return per case
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Core is MIT and must run without the enterprise edition, so only the composition roots below
# import it (see app/ee/__init__.py).
"app.ee".msg = "core code must not import the enterprise edition; plug in through app.ee.hooks"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915", "PT018", "TID251"]
"alembic/**" = ["S608"]
"app/ee/**" = ["TID251"]
"app/main.py" = ["TID251"]
"app/config.py" = ["TID251"]
"app/cli.py" = ["TID251"]
"app/jobs/worker.py" = ["TID251"]
"scripts/ee_license.py" = ["TID251"]
# The accuracy harness shapes synthetic traffic with seeded `random` (reproducible, not secret).
"accuracy/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
# What a bare `uv run mypy` checks; CI names its targets explicitly.
files = ["app", "load", "accuracy"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["opentelemetry.*", "google.protobuf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The accuracy harness imports the Python SDK only during live runs, which add it with
# `uv run --with ../sdks/python`; the backend environment does not install it.
module = ["spanlight", "spanlight.*"]
ignore_missing_imports = true
