name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    outputs:
      verified_sha:
        description: Commit whose required checks all succeeded
        value: ${{ jobs.required.outputs.sha }}

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  # Only a superseded pull request run is worth cancelling; every push to main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      # Every runtime dependency the image ships must declare a licence; the image build writes
      # their notices with the same script. Checked on the runtime set only, then dev is added.
      - run: uv sync --frozen --no-dev --no-install-project
      - run: uv run --no-sync python ../scripts/licenses/python_notices.py --check
      - run: uv sync --frozen
      - run: uv run pytest -q -p no:cacheprovider ../scripts/licenses/test_python_notices.py
      # Known vulnerabilities in the locked runtime dependencies (what the image ships).
      # `shell: bash` adds pipefail, so a failed export fails the step instead of auditing nothing.
      - shell: bash
        run: uv export --frozen --no-dev --no-emit-project | uvx pip-audit@2.10.1 -r /dev/stdin --disable-pip --require-hashes --strict
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy app load accuracy
      # The network-integrity tests drive both SDKs as subprocesses: the Python SDK's venv and the
      # built TypeScript package.
      - run: uv sync --frozen
        working-directory: sdks/python
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci && npm run build
        working-directory: sdks/typescript
      # Each worker owns a disposable Postgres Testcontainer on this hosted runner.
      - run: uv run pytest -q -n auto -m "not serial"
      # Timing and capacity bounds are measured without parallel neighbours.
      - run: uv run pytest -q -m serial

  sdk-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras --python ${{ matrix.python }}
      - shell: bash
        run: uv export --frozen --no-dev --no-emit-project --all-extras | uvx pip-audit@2.10.1 -r /dev/stdin --disable-pip --require-hashes --strict
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src
      - run: uv run pytest -q

  sdk-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Every production npm package the web image ships must declare a licence.
      - run: node ../scripts/licenses/npm_notices.mjs --check
      - run: node --test ../scripts/licenses/npm_notices.test.mjs
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The documentation site (served at /docs/ by the web image). The build copies the runbooks,
  # security pages, changelog and API snapshot into the site, renders the API reference, fails on
  # any broken internal link or heading anchor, and checks that the pages load nothing from another
  # origin (the Content-Security-Policy of /docs/ depends on it). The configuration table is
  # generated from the application's settings, so a setting without a docs entry fails here. The
  # OTLP compatibility page is generated from the recorded fixtures and cannot drift from them.
  docs-site:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
        working-directory: docs-site
      - run: node ../scripts/licenses/npm_notices.mjs --check
        working-directory: docs-site
      - run: npm test
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run python scripts/gen_config_table.py --check
        working-directory: backend
      - run: uv run python scripts/gen_otlp_matrix.py --check
        working-directory: backend

  # The release workflow cannot be run before a tag, so its tag routing, permissions and publish
  # order are checked on every change instead. The same job checks that the community and
  # security files exist and that their YAML parses.
  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv run --no-project --with pyyaml python -m unittest discover -s scripts -p test_release_workflow.py
      - run: uv run --no-project --with pyyaml python scripts/check-release-workflow.py
      - run: uv run --no-project --with pyyaml python scripts/check-otlp-matrix-workflow.py
      - run: uv run --no-project --with pyyaml bash scripts/check-repo-files.sh
      - run: scripts/check-template-fixtures.sh
      - run: scripts/check-links.sh ./*.md backend/README.md frontend/README.md sdks/python/README.md sdks/typescript/README.md docs/api-deviations.md docs/decisions/*.md docs/deploy/railway.md docs/performance.md backend/load/README.md

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          target: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          push: false
          cache-from: type=gha

  # Starts the self-host stack from deploy/compose.yaml on empty volumes and drives it end to
  # end: security headers, signup, API key, a span from the Python SDK, then teardown. Its env
  # file holds random secrets generated for this run only.
  compose-smoke:
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Write a throwaway env file
        run: |
          env_file="$RUNNER_TEMP/compose-smoke.env"
          add_secret() {
            value=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
            echo "::add-mask::$value"
            echo "$1=$value" >> "$env_file"
          }
          : > "$env_file"
          add_secret POSTGRES_PASSWORD
          add_secret APP_DB_PASSWORD
          add_secret SECRET_KEY
          add_secret METRICS_TOKEN
          echo "APP_BASE_URL=http://localhost:8080" >> "$env_file"
          echo "WEB_PORT=8080" >> "$env_file"
          echo "SMOKE_ENV_FILE=$env_file" >> "$GITHUB_ENV"
      - name: Run the compose smoke test
        run: deploy/smoke.sh

  # A reusable workflow can otherwise report success when an upstream job was skipped.
  required:
    if: always()
    needs: [backend, sdk-python, sdk-typescript, frontend, docs-site, workflows, docker, compose-smoke]
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - id: verify
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys

          results = json.loads(os.environ["NEEDS_JSON"])
          if not results or any(job.get("result") != "success" for job in results.values()):
              sys.exit("Required checks did not all succeed")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"sha={os.environ['GITHUB_SHA']}\n")
          PYTHON
