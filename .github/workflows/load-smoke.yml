name: Load test

# Run by hand only. A run builds the self-host stack from the dispatched commit, fills it with
# spans through the real ingestion pipeline and drives it with k6 at the thresholds in
# docs/performance.md. After the three scenarios on the seeded data, and the mixed scenario (reads
# while ingestion runs, in three stages), it measures the overhead of the
# LLM gateway against a fake provider (the same in every profile, it needs no big seed). The result
# tables are on the run's summary page and the raw k6 summaries are an artifact. `realistic` (the
# default) is a run at the size of a small production team, about 1 million spans. `smoke` is a
# small run that checks the setup. `full` is the stress run with 10
# million spans and takes several hours, almost all of it seeding. The profile's settings are in
# the "Set the profile" step. A second job, `alerts-eval`, runs beside it on a stack of its own: it
# seeds 50 projects with 1 000 alert evaluations and fails when `spanlight alerts evaluate` takes
# more than 10 s (the median of three passes). It does not depend on the profile.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "realistic: 1 000 000 spans, 1 min per scenario. smoke: 100 000 spans, 30 s per scenario. full: 10 000 000 spans, 2 to 3 min per scenario."
        type: choice
        options:
          - realistic
          - smoke
          - full
        default: realistic

# One load run at a time. A run that is started while another is going waits; it is not cancelled.
concurrency:
  group: load-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    # The full run is mostly seeding 10 million spans. The runner's own limit is 360 minutes.
    # realistic: 90, smoke: 30, full: 330.
    timeout-minutes: ${{ inputs.profile == 'full' && 330 || inputs.profile == 'realistic' && 90 || 30 }}
    env:
      PROFILE: ${{ inputs.profile }}
      # An exact release, so a run can be repeated with the same tool.
      K6_IMAGE: grafana/k6:2.3.0
      WEB_PORT: "8080"
      LOAD_POSTGRES_PORT: "55433"
      # Where the fake provider of the gateway scenario is published on the runner.
      FAKE_PROVIDER_PORT: "9000"
      COMPOSE_PROJECT_NAME: spanlight-load
      COMPOSE_FILE: deploy/compose.yaml:backend/load/compose.load.yaml
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Seeding ten million spans needs the disk: the table, its indexes and the write-ahead log
      # come to tens of gigabytes. These toolchains are not used here. Only `full` needs this: the
      # `realistic` seed (1 million spans) comes to about 1.5 GB, which fits in what the runner
      # has free, and the cleanup itself takes a minute or two.
      - name: Free disk space
        if: inputs.profile == 'full'
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      # The one place that says what each profile means. SEED_MAX_MINUTES: the seeder stops early
      # when the seed is projected to take longer; what is left of the job limit after it has to
      # cover the build, the rollups, VACUUM and the scenarios. The thresholds do not depend
      # on the profile: they are in the k6 scripts and are the same for all three.
      - name: Set the profile
        run: |
          case "$PROFILE" in
            realistic) spans=1000000;  max_minutes=45;  read=1m;  ingest=1m ;;
            smoke)     spans=100000;   max_minutes=15;  read=30s; ingest=30s ;;
            full)      spans=10000000; max_minutes=240; read=2m;  ingest=3m ;;
            *) echo "::error::unknown profile '$PROFILE'"; exit 1 ;;
          esac
          {
            echo "SEED_SPANS=$spans"
            echo "SEED_MAX_MINUTES=$max_minutes"
            echo "READ_DURATION=$read"
            echo "INGEST_DURATION=$ingest"
          } >> "$GITHUB_ENV"

      # The same throwaway secrets as the compose-smoke job in ci.yml: random, masked in the log
      # and gone with the runner.
      - name: Write a throwaway env file
        run: |
          env_file="$RUNNER_TEMP/load.env"
          add_secret() {
            value=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
            echo "::add-mask::$value"
            echo "$1=$value" >> "$env_file"
          }
          : > "$env_file"
          add_secret POSTGRES_PASSWORD
          add_secret APP_DB_PASSWORD
          add_secret SECRET_KEY
          add_secret METRICS_TOKEN
          echo "APP_BASE_URL=http://localhost:$WEB_PORT" >> "$env_file"
          echo "WEB_PORT=$WEB_PORT" >> "$env_file"
          echo "LOAD_POSTGRES_PORT=$LOAD_POSTGRES_PORT" >> "$env_file"
          echo "LOAD_FAKE_PROVIDER_PORT=$FAKE_PROVIDER_PORT" >> "$env_file"
          mkdir -p "$RUNNER_TEMP/load-results" "$RUNNER_TEMP/load-credentials"
          echo "LOAD_ENV_FILE=$env_file" >> "$GITHUB_ENV"
          echo "RESULTS_DIR=$RUNNER_TEMP/load-results" >> "$GITHUB_ENV"
          echo "CREDENTIALS_FILE=$RUNNER_TEMP/load-credentials/credentials.json" >> "$GITHUB_ENV"
          echo "GATEWAY_CREDENTIALS_FILE=$RUNNER_TEMP/load-credentials/gateway-credentials.json" >> "$GITHUB_ENV"

      - name: Start the stack
        run: docker compose --env-file "$LOAD_ENV_FILE" up -d --build

      - name: Wait for the stack to be ready
        run: |
          for _ in $(seq 1 90); do
            if curl --fail --silent --output /dev/null "http://localhost:$WEB_PORT/health/ready"; then
              exit 0
            fi
            sleep 2
          done
          echo "the stack was not ready after 180 s" >&2
          exit 1

      # Writes the keys to $CREDENTIALS_FILE (mode 600) and prints nothing secret.
      - name: Seed the database
        working-directory: backend
        run: |
          postgres_password=$(sed -n 's/^POSTGRES_PASSWORD=//p' "$LOAD_ENV_FILE")
          export LOAD_DATABASE_URL="postgresql+psycopg://postgres:${postgres_password}@127.0.0.1:${LOAD_POSTGRES_PORT}/spanlight"
          df -h
          uv run --frozen --no-dev python load/seed.py \
            --spans "$SEED_SPANS" --max-minutes "$SEED_MAX_MINUTES" \
            --credentials-file "$CREDENTIALS_FILE"
          df -h

      # The gateway scenario's pieces: a credential on the fake provider (sealed with the throwaway
      # keyring that compose.load.yaml gives the api and the worker), a route and a gateway key
      # without limits. Writes the key to $GATEWAY_CREDENTIALS_FILE (mode 600), prints nothing
      # secret. The profile does not matter: this needs no spans.
      - name: Seed the gateway
        working-directory: backend
        run: |
          postgres_password=$(sed -n 's/^POSTGRES_PASSWORD=//p' "$LOAD_ENV_FILE")
          export LOAD_DATABASE_URL="postgresql+psycopg://postgres:${postgres_password}@127.0.0.1:${LOAD_POSTGRES_PORT}/spanlight"
          uv run --frozen --no-dev python load/seed_gateway.py \
            --credentials-file "$GATEWAY_CREDENTIALS_FILE"

      # Before any step that could print them.
      - name: Mask the API keys
        run: |
          jq -r '.ingest_key, .read_keys[]' "$CREDENTIALS_FILE" | while IFS= read -r key; do
            echo "::add-mask::$key"
          done
          echo "::add-mask::$(jq -r '.gateway_key' "$GATEWAY_CREDENTIALS_FILE")"

      - name: Record the environment
        run: |
          psql_value() {
            docker compose --env-file "$LOAD_ENV_FILE" exec -T postgres \
              psql -U postgres -d spanlight -tAc "$1"
          }
          date_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cores=$(nproc)
          memory=$(awk '/MemTotal/ {printf "%.1f GiB", $2 / 1048576}' /proc/meminfo)
          disk=$(df -h --output=size,avail / | tail -n 1 | awk '{print $1 " total, " $2 " free"}')
          runner_image="${ImageOS:-unknown} ${ImageVersion:-unknown}"
          postgres_version=$(psql_value 'SHOW server_version')
          spans=$(psql_value 'SELECT count(*) FROM spans')
          traces=$(psql_value 'SELECT count(*) FROM traces')
          k6_version=$(docker run --rm "$K6_IMAGE" version | head -n 1)
          jq -n \
            --arg date_utc "$date_utc" --arg profile "$PROFILE" --arg commit "$GITHUB_SHA" \
            --arg vcpus "$cores" --arg memory "$memory" --arg disk "$disk" \
            --arg runner_image "$runner_image" --arg postgres "$postgres_version" \
            --arg k6 "$k6_version" --arg spans "$spans" --arg traces "$traces" \
            '{date_utc: $date_utc, profile: $profile, commit: $commit, vcpus: $vcpus,
              memory: $memory, disk_after_seeding: $disk, runner_image: $runner_image,
              postgres: $postgres, k6: $k6, seeded_spans: $spans, seeded_traces: $traces}' \
            > "$RESULTS_DIR/environment.json"
          cat > "$RESULTS_DIR/environment.md" <<EOF
          ### Load test run

          | | |
          |---|---|
          | Date (UTC) | $date_utc |
          | Profile | $PROFILE |
          | Commit (the image is built from it) | \`$GITHUB_SHA\` |
          | Runner | ubuntu-latest, $cores vCPU, $memory RAM, disk $disk (after seeding) |
          | Runner image | $runner_image |
          | Postgres | $postgres_version |
          | k6 | $k6_version |
          | Seeded | $spans spans in $traces traces |
          EOF

      # Every script runs even when an earlier one misses its thresholds, so one run records all
      # of them. `mixed-<stage>` runs mixed.js with the stage's ingest rate (baseline 0, half 5,
      # near-knee 10 requests of 100 spans a second); near-knee is reported but does not fail the
      # job, since its latency on a shared runner varies from run to run. The step, and with it the job, still ends red if any of them did, or if a script
      # did not write its results: when handleSummary throws, k6 prints its default summary and
      # exits 0, so the exit status alone cannot tell. Before each script the database is given up
      # to two minutes to finish the work of the one before (see backend/load/settle.sh).
      # The gateway script holds its own durations (60 s a scenario in every profile) and ignores
      # DURATION. k6 cannot compare two thresholds, so the script stores the overhead (gateway p95
      # minus direct p95) in gateway.json and this step fails the job when it is not under the limit.
      - name: Run the k6 scenarios
        run: |
          status=0
          for script in overview traces mixed-baseline mixed-half mixed-near-knee ingest gateway; do
            duration=$READ_DURATION
            if [ "$script" = ingest ]; then duration=$INGEST_DURATION; fi
            file=$script ingest_rps=0 gated=true
            case "$script" in
              mixed-baseline) file=mixed ingest_rps=0 ;;
              mixed-half) file=mixed ingest_rps=5 ;;
              mixed-near-knee) file=mixed ingest_rps=10 gated=false ;;
            esac
            bash backend/load/settle.sh
            echo "::group::k6 $script"
            docker run --rm --network host --user "$(id -u):$(id -g)" \
              -e K6_NO_USAGE_REPORT=true \
              -e BASE_URL="http://localhost:$WEB_PORT" -e DURATION="$duration" \
              -e FAKE_PROVIDER_URL="http://localhost:$FAKE_PROVIDER_PORT" \
              -e CREDENTIALS_FILE=/creds/credentials.json \
              -e GATEWAY_CREDENTIALS_FILE=/creds/gateway-credentials.json \
              -e RESULTS_DIR=/results -e NAME="$script" -e INGEST_RPS="$ingest_rps" \
              -v "$GITHUB_WORKSPACE/backend/load:/load:ro" \
              -v "$(dirname "$CREDENTIALS_FILE"):/creds:ro" \
              -v "$RESULTS_DIR:/results" \
              "$K6_IMAGE" run "/load/$file.js" || { [ "$gated" = false ] || status=1; }
            echo "::endgroup::"
            for extension in json md; do
              if [ ! -s "$RESULTS_DIR/$script.$extension" ]; then
                echo "::error::k6 $script wrote no $script.$extension; see the handleSummary error in its log"
                status=1
              fi
            done
            if [ "$script" = gateway ] && [ -s "$RESULTS_DIR/gateway.json" ] \
              && ! jq -e '.overhead.ok == true' "$RESULTS_DIR/gateway.json" > /dev/null; then
              echo "::error::the gateway overhead is not under 20 ms; see the table in gateway.md"
              status=1
            fi
          done
          exit "$status"

      # Appends what exists, then fails if anything expected is missing: a run without its tables
      # must not look green.
      - name: Publish the results
        if: always()
        run: |
          status=0
          for name in environment overview traces mixed-baseline mixed-half mixed-near-knee ingest gateway; do
            if [ -s "$RESULTS_DIR/$name.md" ]; then
              cat "$RESULTS_DIR/$name.md" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::no $name.md in the results"
              status=1
            fi
            if [ ! -s "$RESULTS_DIR/$name.json" ]; then
              echo "::error::no $name.json in the results"
              status=1
            fi
          done
          exit "$status"

      - name: Upload the k6 summaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-results-${{ inputs.profile }}
          path: ${{ runner.temp }}/load-results/*.json
          if-no-files-found: error
          retention-days: 90

      # The whole log of each service, not its tail: the line that explains a failure is rarely
      # among the last few. Counts the error-level events and the unhandled exceptions by type,
      # then prints the first 20 of them. The 503s the API answers when the database is behind
      # are logged as warnings under their own names, so they are counted separately.
      - name: Summarize errors in the service logs
        if: always()
        run: |
          for service in api worker; do
            log="$RUNNER_TEMP/$service.log"
            errors="$RUNNER_TEMP/$service-errors.jsonl"
            docker compose --env-file "$LOAD_ENV_FILE" logs --no-color --no-log-prefix "$service" \
              > "$log" || true
            # The services log JSON lines; `fromjson?` skips anything else, such as a traceback
            # printed by a crash.
            jq -R -c 'fromjson? | select(.level == "error" or .event == "unhandled_exception")' \
              "$log" > "$errors" || true
            echo "::group::$service: error events over the whole run"
            echo "error-level events: $(wc -l < "$errors")"
            echo "by event and error type:"
            jq -r -s 'group_by([.event, (.error_type // "-")]) | sort_by(-length) | .[]
              | "\(length)\t\(.[0].event)\t\(.[0].error_type // "-")"' "$errors" || true
            echo "first 20:"
            head -n 20 "$errors" | cut -c1-2000
            echo "database limit warnings (503 answers): $(
              jq -R -c 'fromjson? | select(.event == "db_pool_timeout" or .event == "db_statement_timeout")' \
                "$log" | wc -l)"
            echo "::endgroup::"
          done

  # The alert evaluation pass over 50 projects x 20 evaluations (18 rules and 2 budgets), 7 days of
  # spans and rollups each (backend/load/alerts.md). It runs on a stack of its own so the k6
  # scenarios of the `load` job are not disturbed. The worker's own evaluation job is switched
  # off, otherwise it would take rules away from the timed passes. The passes are real (no
  # --dry-run): the commits are part of the cost. No rule names a channel, so nothing is queued
  # in the outbox.
  alerts-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB_PORT: "8080"
      LOAD_POSTGRES_PORT: "55433"
      COMPOSE_PROJECT_NAME: spanlight-alerts
      COMPOSE_FILE: deploy/compose.yaml:backend/load/compose.load.yaml
      # 50 projects x 20 evaluations, and the limit the exit criterion sets.
      EXPECTED_RULES: "1000"
      LIMIT_SECONDS: "10"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Write a throwaway env file
        run: |
          env_file="$RUNNER_TEMP/alerts.env"
          add_secret() {
            value=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
            echo "::add-mask::$value"
            echo "$1=$value" >> "$env_file"
          }
          : > "$env_file"
          add_secret POSTGRES_PASSWORD
          add_secret APP_DB_PASSWORD
          add_secret SECRET_KEY
          add_secret METRICS_TOKEN
          echo "APP_BASE_URL=http://localhost:$WEB_PORT" >> "$env_file"
          echo "WEB_PORT=$WEB_PORT" >> "$env_file"
          echo "LOAD_POSTGRES_PORT=$LOAD_POSTGRES_PORT" >> "$env_file"
          echo "ALERTS_EVALUATION_ENABLED=false" >> "$env_file"
          mkdir -p "$RUNNER_TEMP/alerts-results"
          echo "LOAD_ENV_FILE=$env_file" >> "$GITHUB_ENV"
          echo "RESULTS_DIR=$RUNNER_TEMP/alerts-results" >> "$GITHUB_ENV"

      - name: Start the stack
        run: docker compose --env-file "$LOAD_ENV_FILE" up -d --build

      - name: Wait for the stack to be ready
        run: |
          for _ in $(seq 1 90); do
            if curl --fail --silent --output /dev/null "http://localhost:$WEB_PORT/health/ready"; then
              exit 0
            fi
            sleep 2
          done
          echo "the stack was not ready after 180 s" >&2
          exit 1

      - name: Seed the alert rules and their spans
        working-directory: backend
        run: |
          postgres_password=$(sed -n 's/^POSTGRES_PASSWORD=//p' "$LOAD_ENV_FILE")
          export LOAD_DATABASE_URL="postgresql+psycopg://postgres:${postgres_password}@127.0.0.1:${LOAD_POSTGRES_PORT}/spanlight"
          uv run --frozen --no-dev python load/seed_alerts.py

      # Three passes in the worker container (it has the app role and the image's `spanlight`).
      # A pass that fails (exit status 1: a rule or a project errored) is kept in the results and
      # fails the job below, after the summary is written.
      - name: Evaluate three times
        run: |
          bash backend/load/settle.sh
          status=0
          for run in 1 2 3; do
            docker compose --env-file "$LOAD_ENV_FILE" exec -T worker \
              spanlight alerts evaluate --json > "$RESULTS_DIR/alerts-eval-$run.json" || status=1
            cat "$RESULTS_DIR/alerts-eval-$run.json"  # logs are on stderr: this is the result
          done
          exit "$status"

      # Each file holds the output of one pass. Logs go to stderr, so a file should be one JSON
      # object, but a stray line must not hide the result: only the last line that parses as an
      # object with `seconds` is used. Every jq call is guarded, so a missing or malformed file
      # still gets a summary and a clear error, and the job then fails.
      - name: Publish the result and check the limit
        if: always()
        run: |
          set +e
          status=0
          fail() { echo "::error::$1"; echo "- $1" >> "$GITHUB_STEP_SUMMARY"; status=1; }
          echo "### Alert evaluation" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          passes=()
          for run in 1 2 3; do
            raw="$RESULTS_DIR/alerts-eval-$run.json"
            result="$RESULTS_DIR/pass-$run.json"
            if [ -s "$raw" ] \
              && jq -R -c 'fromjson? | select(type == "object" and (.seconds | type) == "number")' "$raw" \
                | tail -n 1 > "$result" && [ -s "$result" ]; then
              passes+=("$result")
            else
              fail "pass $run wrote no usable result (see alerts-eval-$run.json in the artifact)"
            fi
          done
          if [ "${#passes[@]}" -gt 0 ]; then
            median=$(jq -s 'map(.seconds) | sort | .[length / 2 | floor]' "${passes[@]}")
            rules=$(jq -s 'map(.rules) | min' "${passes[@]}")
            errors=$(jq -s 'map(.errors + .projects_failed) | add' "${passes[@]}")
            seconds=$(jq -s -r 'map(.seconds * 100 | round / 100 | tostring) | join(", ")' "${passes[@]}")
            postgres_version=$(docker compose --env-file "$LOAD_ENV_FILE" exec -T postgres \
              psql -U postgres -d spanlight -tAc 'SHOW server_version')
            memory=$(awk '/MemTotal/ {printf "%.1f GiB", $2 / 1048576}' /proc/meminfo)
            {
              echo "| | |"
              echo "|---|---|"
              echo "| Date (UTC) | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
              echo "| Commit | \`$GITHUB_SHA\` |"
              echo "| Runner | ubuntu-latest, $(nproc) vCPU, $memory RAM (image ${ImageOS:-unknown} ${ImageVersion:-unknown}) |"
              echo "| Postgres | $postgres_version |"
              echo "| Rules evaluated per pass | $rules (expected $EXPECTED_RULES) |"
              echo "| Passes | ${#passes[@]} of 3 |"
              echo "| Seconds per pass | $seconds |"
              echo "| **Median** | **$median s** (limit $LIMIT_SECONDS s) |"
              echo "| Rule or project errors | $errors |"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$rules" -lt "$EXPECTED_RULES" ]; then
              fail "only $rules rules were evaluated, expected $EXPECTED_RULES"
            fi
            if [ "$errors" -ne 0 ]; then
              fail "$errors rule or project errors; see the worker log"
            fi
            if ! jq -n -e --argjson m "$median" --argjson l "$LIMIT_SECONDS" '$m <= $l' > /dev/null; then
              fail "the median pass took $median s, over the $LIMIT_SECONDS s limit"
            fi
          fi
          exit "$status"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alerts-eval-results
          path: ${{ runner.temp }}/alerts-results/*.json
          if-no-files-found: warn
          retention-days: 90

      - name: Worker log
        if: always()
        run: docker compose --env-file "$LOAD_ENV_FILE" logs --no-color --no-log-prefix --tail 200 worker
