name: Release

# Three independent release trains, each started only by its own tag pattern:
#   v1.2.3                 -> server images on GHCR + a GitHub Release (job: server)
#   sdk-python-v1.2.3      -> Python SDK on PyPI                       (job: sdk-python)
#   sdk-typescript-v1.2.3  -> TypeScript SDK on npm                    (job: sdk-typescript)
# The job-level `if:` guards below are what keep the trains apart; scripts/check-release-workflow.py
# pins them, so edit both together.
# Every action is pinned to a commit SHA, not a tag, because these jobs can publish images and
# packages: a moved tag would run new code with those rights. The `# vX.Y.Z` comment names the
# release; the same script checks both. Dependabot raises the SHA and the comment together.
on:
  push:
    tags:
      - "v*"
      - "sdk-python-v*"
      - "sdk-typescript-v*"

permissions:
  contents: read

jobs:
  # Local reusable workflows execute the version at this tagged commit, never branch-head CI.
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  server:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && needs.verify.result == 'success' && needs.verify.outputs.verified_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the GitHub Release and upload its assets
      packages: write # push images to GHCR
      id-token: write # cosign keyless signing (OIDC identity of this workflow)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false # no step pushes, so keep the token out of .git/config

      - name: Resolve version and registry
        id: meta
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not v<semver>"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          {
            # GHCR repository names must be lowercase; the owner login may not be.
            echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
            echo "version=${version}"
            # A pre-release (1.2.3-rc.1) must not move `latest`.
            echo "prerelease=$([[ "${version}" == *-* ]] && echo true || echo false)"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Both images are built into the local Docker daemon (load) so they can be scanned
      # before anything reaches GHCR.
      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          target: backend
          load: true
          # Keep a single image manifest; signed SBOMs are generated below.
          provenance: false
          push: false
          tags: ${{ steps.meta.outputs.registry }}/spanlight:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-backend
          cache-to: type=gha,mode=max,scope=release-backend

      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          load: true
          # Keep a single image manifest; signed SBOMs are generated below.
          provenance: false
          push: false
          tags: ${{ steps.meta.outputs.registry }}/spanlight-web:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-web
          cache-to: type=gha,mode=max,scope=release-web

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      # Smoke the loaded candidates, not another build. Removing build sections makes the
      # smoke script's --build inert; pull_policy prevents replacing a candidate from GHCR.
      - name: Test release candidate images
        env:
          SPANLIGHT_IMAGE: ${{ steps.meta.outputs.registry }}/spanlight:${{ steps.meta.outputs.version }}
          SPANLIGHT_WEB_IMAGE: ${{ steps.meta.outputs.registry }}/spanlight-web:${{ steps.meta.outputs.version }}
          SMOKE_PROJECT: spanlight-release-smoke
        run: |
          env_file="$RUNNER_TEMP/release-smoke.env"
          : > "$env_file"
          for key in POSTGRES_PASSWORD APP_DB_PASSWORD SECRET_KEY METRICS_TOKEN; do
            value=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
            echo "::add-mask::$value"
            echo "$key=$value" >> "$env_file"
          done
          echo "APP_BASE_URL=http://localhost:8080" >> "$env_file"
          echo "WEB_PORT=8080" >> "$env_file"
          export SMOKE_ENV_FILE="$env_file"
          docker image inspect --format '{{.Id}}' "$SPANLIGHT_IMAGE" "$SPANLIGHT_WEB_IMAGE" > "$RUNNER_TEMP/candidate-ids"
          docker compose -p "$SMOKE_PROJECT" -f deploy/compose.yaml --env-file "$env_file" config --format json > "$RUNNER_TEMP/candidate-compose.json"
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          config = json.loads((Path(os.environ["RUNNER_TEMP"]) / "candidate-compose.json").read_text())
          for service in config["services"].values():
              if "build" in service:
                  del service["build"]
                  service["pull_policy"] = "never"
          Path("deploy/compose.yaml").write_text(json.dumps(config))
          PYTHON
          deploy/smoke.sh
          docker image inspect --format '{{.Id}}' "$SPANLIGHT_IMAGE" "$SPANLIGHT_WEB_IMAGE" > "$RUNNER_TEMP/tested-ids"
          cmp "$RUNNER_TEMP/candidate-ids" "$RUNNER_TEMP/tested-ids"
          echo "Tested source: ${GITHUB_SHA}; candidate image IDs (backend, web):" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/tested-ids" >> "$GITHUB_STEP_SUMMARY"
          # Restore source for review tooling; images remain loaded and are pushed below.
          git checkout -- deploy/compose.yaml

      # Scan first, push second: a failing scan leaves nothing in GHCR to take back. Trivy runs
      # from its container pinned by digest (its GitHub Action publishes no major tag to pin to).
      # --ignore-unfixed keeps base-image CVEs with no available fix from blocking every release.
      - name: Scan images with Trivy (fail on CRITICAL/HIGH)
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          trivy="aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa"
          for image in spanlight spanlight-web; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${HOME}/.cache/trivy:/root/.cache/" \
              "${trivy}" image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed \
              "${REGISTRY}/${image}:${VERSION}"
          done

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushes the exact images that were smoke-tested and scanned, under their version tag only, then records
      # their digests: signing and the SBOMs refer to the digest, not to a tag that could later
      # move. The moving `latest` tag waits until the signatures exist (see "Move latest").
      - name: Push images
        id: push
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker image inspect --format '{{.Id}}' "${REGISTRY}/spanlight:${VERSION}" "${REGISTRY}/spanlight-web:${VERSION}" > "$RUNNER_TEMP/publish-ids"
          cmp "$RUNNER_TEMP/tested-ids" "$RUNNER_TEMP/publish-ids"
          for pair in backend:spanlight web:spanlight-web; do
            output="${pair%%:*}"
            ref="${REGISTRY}/${pair#*:}"
            docker push "${ref}:${VERSION}"
            digest_ref="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${ref}:${VERSION}" | grep -F "${ref}@" | head -n 1)"
            if [[ -z "${digest_ref}" ]]; then
              echo "::error::No digest recorded for ${ref}:${VERSION} after push"
              exit 1
            fi
            # Docker exposes a manifest ID with containerd, or a config ID with the classic store.
            local_id=$(docker image inspect --format '{{.Id}}' "${ref}:${VERSION}")
            remote_id=$(docker buildx imagetools inspect --raw "${digest_ref}" | jq -er '.config.digest')
            if [[ "$local_id" != "$remote_id" && "$local_id" != "${digest_ref#*@}" ]]; then
              echo "::error::Published digest does not match tested ${ref}:${VERSION}"
              exit 1
            fi
            echo "${output}=${digest_ref}" >> "${GITHUB_OUTPUT}"
            echo "${output}: ${digest_ref} (tested image ID ${local_id})" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign images (keyless)
        env:
          BACKEND: ${{ steps.push.outputs.backend }}
          WEB: ${{ steps.push.outputs.web }}
        run: cosign sign --yes "${BACKEND}" "${WEB}"

      # Same image, same digest, so `latest` carries the signature made above. A failed scan,
      # push or signature never gets this far, and a pre-release (1.2.3-rc.1) never moves it.
      - name: Move latest (stable releases only)
        if: steps.meta.outputs.prerelease == 'false'
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          for name in spanlight spanlight-web; do
            docker tag "${REGISTRY}/${name}:${VERSION}" "${REGISTRY}/${name}:latest"
            docker push "${REGISTRY}/${name}:latest"
          done

      - name: SBOM for the backend image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.push.outputs.backend }}
          format: cyclonedx-json
          output-file: sbom-spanlight.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SBOM for the web image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.push.outputs.web }}
          format: cyclonedx-json
          output-file: sbom-spanlight-web.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # Each SBOM gets a Sigstore bundle so downstream users can run `cosign verify-blob`.
      - name: Sign SBOMs (keyless)
        run: |
          for sbom in sbom-*.cdx.json; do
            cosign sign-blob --yes --bundle "${sbom}.sigstore.json" "${sbom}"
          done

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            sbom-*.cdx.json
            sbom-*.cdx.json.sigstore.json

  sdk-python:
    if: startsWith(github.ref, 'refs/tags/sdk-python-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The `pypi` environment is the one registered with PyPI's trusted publisher for `spanlight`;
    # no API token secret exists anywhere.
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC)
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false # no step pushes, so keep the token out of .git/config
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      # The version lives in pyproject.toml and again in src/spanlight/_version.py (sent in the
      # User-Agent header). Refuse a tag that disagrees with either, so the wrong number can
      # never reach PyPI (uploads there are permanent).
      - name: Check the tag matches pyproject.toml and _version.py
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          module_version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/spanlight/_version.py)"
          if [[ "${GITHUB_REF_NAME}" != "sdk-python-v${version}" ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match pyproject.toml version '${version}'"
            exit 1
          fi
          if [[ "${module_version}" != "${version}" ]]; then
            echo "::error::src/spanlight/_version.py says '${module_version}' but pyproject.toml says '${version}'"
            exit 1
          fi

      # The SDK suite, as CI runs it, on the tagged commit: a PyPI upload cannot be taken back, so
      # run it before building anything.
      - run: uv sync --frozen --all-extras
      - run: uv run pytest -q

      - run: uv build

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: sdks/python/dist/

  sdk-typescript:
    if: startsWith(github.ref, 'refs/tags/sdk-typescript-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The `npm` environment is the one registered with npm's trusted publisher for `spanlight`;
    # no npm token secret exists anywhere.
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false # no step pushes, so keep the token out of .git/config
      # No dependency cache: a publish job should not restore state another run wrote.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # trusted publishing needs Node 22.14 or later
          registry-url: https://registry.npmjs.org

      - name: npm 11.5.1 or later (trusted publishing needs it)
        run: |
          if [[ "$(printf '%s\n' 11.5.1 "$(npm --version)" | sort -V | head -n 1)" != "11.5.1" ]]; then
            npm install -g npm@11.5.1
          fi
          npm --version

      # The version lives in package.json and again in src/version.ts (sent in the User-Agent
      # header). Refuse a tag that disagrees with either: an npm version can never be reused.
      - name: Check the tag matches package.json and version.ts
        run: |
          version="$(node -p "require('./package.json').version")"
          module_version="$(sed -n 's/^export const VERSION = "\(.*\)";$/\1/p' src/version.ts)"
          if [[ "${GITHUB_REF_NAME}" != "sdk-typescript-v${version}" ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match package.json version '${version}'"
            exit 1
          fi
          if [[ "${module_version}" != "${version}" ]]; then
            echo "::error::src/version.ts says '${module_version}' but package.json says '${version}'"
            exit 1
          fi

      # The SDK checks, as CI runs them, on the tagged commit, before anything is published.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # `prepack` builds dist/. Provenance links the package to this workflow run.
      - run: npm publish --access public --provenance
