name: Bug report
description: Something in Spanlight is broken or behaves differently from the documentation.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. A clear report is usually fixed faster than a vague one.

        **Security problems do not belong here.** Report a vulnerability privately through
        [GitHub private vulnerability reporting](https://github.com/dheerajkarwasra/spanlight/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: >-
        The server image tag (for example 0.1.0), or the commit from `git rev-parse --short HEAD`
        if you run from source. If the bug involves the Python SDK, add its version
        (`pip show spanlight`).
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running Spanlight?
      options:
        - Docker Compose (deploy/compose.yaml)
        - Railway
        - Local development (uv and npm)
        - Other (describe below)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that start from a fresh page load or a fresh install.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead. Add a screenshot if it is a visual problem.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Relevant output from the api, worker or browser console. Redact secrets (API keys,
        SECRET_KEY, passwords, session cookies) and prompt or completion content before pasting.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find this bug.
          required: true
        - label: I removed secrets and prompt content from everything I pasted.
          required: true
