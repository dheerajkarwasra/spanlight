name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please check the [roadmap](https://github.com/dheerajkarwasra/spanlight#roadmap)
        first: it may already be planned, and the phase it belongs to affects when it can land.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Spanlight do? Describe the behaviour you would see, not the implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you solve this today, and why they fall short.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Server and API
        - Web dashboard
        - Python SDK
        - Deployment and operations
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and the roadmap.
          required: true
        - label: I would be willing to help build this.
