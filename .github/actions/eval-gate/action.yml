name: Spanlight eval gate
description: >-
  Run a prompt version over a Spanlight dataset, score it with your evaluators and fail the job
  when a score is below its threshold.
author: Spanlight

inputs:
  host:
    description: URL of your Spanlight instance, for example https://spanlight.example.com.
    required: true
  token:
    description: >-
      A personal access token (spl_pat_...) with the write scope. Store it as a secret.
    required: true
  project-id:
    description: Id of the Spanlight project that owns the dataset and the prompt.
    required: true
  dataset:
    description: Name of the dataset to run.
    required: true
  prompt:
    description: >-
      The prompt to test: a name, name@label or name:version. A bare name means the production
      label.
    required: true
  evaluators:
    description: Comma-separated names of the evaluators that score each answer.
    required: false
    default: ''
  fail-below:
    description: >-
      Minimum mean per score, for example relevance=0.8,format=1. The job fails when a mean is
      lower, or when the run produced no value for a listed score. Empty means report only.
    required: false
    default: ''
  credential-id:
    description: >-
      Id of the provider credential to run the prompt on. With the evaluators and the model it
      selects the experiment, so a different value is a different experiment.
    required: true
  model:
    description: Model to run the prompt on.
    required: true
  max-cost-usd:
    description: >-
      Cost cap of one run, in US dollars. Used only when the experiment is created; empty means
      the server default.
    required: false
    default: ''
  python-version:
    description: Python version to run the gate with (3.10 or newer).
    required: false
    default: '3.12'
  sdk-ref:
    description: >-
      Git ref (tag or commit) of the Spanlight repository to install the SDK from. Empty means
      the ref this action was pinned to, so the SDK always matches the action; `main` only when
      that is unknown.
    required: false
    default: ''

outputs:
  run-id:
    description: Id of the experiment run.
    value: ${{ steps.gate.outputs.run-id }}
  run-url:
    description: Link to the run page in the Spanlight dashboard.
    value: ${{ steps.gate.outputs.run-url }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install the Spanlight SDK
      shell: bash
      env:
        # The SDK comes from the same ref as the action unless a ref is given.
        SDK_REF: ${{ inputs.sdk-ref || github.action_ref || 'main' }}
      run: |
        python -m pip install --disable-pip-version-check --quiet \
          "spanlight @ git+https://github.com/dheerajkarwasra/spanlight@${SDK_REF}#subdirectory=sdks/python"

    - name: Run the eval gate
      id: gate
      shell: bash
      # Inputs reach the script as environment variables, never as text pasted into it.
      env:
        SPANLIGHT_HOST: ${{ inputs.host }}
        SPANLIGHT_TOKEN: ${{ inputs.token }}
        SPANLIGHT_PROJECT_ID: ${{ inputs.project-id }}
        GATE_DATASET: ${{ inputs.dataset }}
        GATE_PROMPT: ${{ inputs.prompt }}
        GATE_EVALUATORS: ${{ inputs.evaluators }}
        GATE_FAIL_BELOW: ${{ inputs.fail-below }}
        GATE_CREDENTIAL_ID: ${{ inputs.credential-id }}
        GATE_MODEL: ${{ inputs.model }}
        GATE_MAX_COST_USD: ${{ inputs.max-cost-usd }}
      run: |
        args=(--dataset "$GATE_DATASET" --prompt "$GATE_PROMPT"
              --evaluators "$GATE_EVALUATORS" --fail-below "$GATE_FAIL_BELOW"
              --credential-id "$GATE_CREDENTIAL_ID" --model "$GATE_MODEL")
        if [ -n "$GATE_MAX_COST_USD" ]; then args+=(--max-cost-usd "$GATE_MAX_COST_USD"); fi
        python -m spanlight._experiments "${args[@]}"
